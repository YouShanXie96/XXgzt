<body class="auth-locked">
  <div id="auth-gate" class="auth-gate" aria-live="polite">
    <section class="cloud-auth-card cloud-auth-checking"><span class="spinner"></span><strong>正在自动登录…</strong><p>正在确认本机登录状态，请稍候</p></section>
  </div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><span class="brand-mark">谢</span><div class="brand-text"><strong>谢谢工作台</strong><small>店铺运营 · 本地工作空间</small></div></div>
      <button type="button" class="sidebar-pin sidebar-pin-standalone" id="sidebar-pin" data-action="toggle-sidebar-pin" title="收起侧边栏" aria-label="收起侧边栏" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="sidebar-pin-text">收起</span></button>

    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-heading" id="topbar-heading"></div>
        <div class="store-switch"><select id="store-select" aria-label="选择当前店铺"><option value="">尚未添加店铺</option></select></div>
      </header>
      <div id="progress-area" class="progress-area" aria-live="polite"></div>
      <div id="error-area" class="error-area" role="alert"></div>
      <main id="content" tabindex="-1"></main>
    </div>
  </div>
  <div id="plugin-overlay"></div>
  <dialog id="dialog"><form id="dialog-form" method="dialog"><div id="dialog-content"></div><div class="dialog-actions"><button type="button" class="button" id="dialog-cancel">取消</button><button type="submit" class="button primary" id="dialog-confirm">确认</button></div></form></dialog>
